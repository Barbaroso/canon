name: "Copilot Setup Steps"

# Provisions the coding agent's environment. Also runs as an ordinary workflow
# whenever this file changes, so a mistake here is visible before an agent
# inherits it.
#
# Hardening notes (v0.3):
#  - actions are pinned to a commit sha, not a mutable major tag
#  - checkout does not persist the GITHUB_TOKEN into .git/config
#  - `pnpm install --frozen-lockfile` has no fallback: a lockfile that does not
#    match package.json must fail loudly, not silently resolve fresh versions
#  - gitleaks is verified against its published sha256 before it is installed
#  - semgrep is pinned; `pipx install semgrep` would float

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  # The job MUST be named copilot-setup-steps or the agent will not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect lockfile
        id: lock
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node with pnpm cache
        if: steps.lock.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Node
        if: steps.lock.outputs.exists != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::notice::No package.json on this ref yet (pre-M0); skipping install."
            exit 0
          fi
          pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: |
          set -euo pipefail
          pipx install "semgrep==1.172.0"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.0"
          GITLEAKS_SHA256: "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 -o "${tmp}/gitleaks.tar.gz" "${url}"
          echo "${GITLEAKS_SHA256}  ${tmp}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/gitleaks.tar.gz" -C "${tmp}" gitleaks
          sudo install -m 0755 "${tmp}/gitleaks" /usr/local/bin/gitleaks
          rm -rf "${tmp}"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          semgrep --version
          gitleaks version
